<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хочу знать | Анализ данных</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f4;
            color: #2c3e2b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .loader-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(45, 90, 39, 0.1);
            max-width: 500px;
            width: 100%;
            border-top: 5px solid #2d5a27;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e2ebe2;
            border-top: 5px solid #4e8746;
            border-radius: 50%;
            margin: 0 auto 25px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { color: #2d5a27; margin-bottom: 15px; font-size: 22px; min-height: 30px; }
        p { color: #667c65; font-size: 15px; }
    </style>
</head>
<body>

    <div class="loader-card">
        <!-- Твой любимый крутящийся кружочек на месте! -->
        <div class="spinner"></div>
        <!-- Сюда красиво выводятся бегущие статусы нейросети -->
        <h2 id="ai-status">ИИ «Хочу знать» запускается...</h2>
        <p>Пожалуйста, подождите. Наша автономная нейросеть монтирует персональный MP4-ролик в облаке.</p>
    </div>

    <script>
        const statusElement = document.getElementById('ai-status');
        
        // Твой список завораживающих фраз, которые видит человек
        const aiSteps = [
            "🤖 Устанавливаю мост с Google Gemini AI...",
            "🔍 Нейросеть собирает ключевые факты по теме...",
            "🎙️ Передаю тезисы ИИ-роботу на русскую озвучку...",
            "🎬 Утилита FFmpeg запускает облачный видеомонтаж...",
            "📦 Упаковываю готовый фильм в формат MP4..."
        ];

        let currentStep = 0;

        // Плавная смена надписей каждые 2.5 секунды, чтобы показать работу ИИ
        function updateStatus() {
            if (currentStep < aiSteps.length) {
                statusElement.innerText = aiSteps[currentStep];
                currentStep++;
            }
        }

        updateStatus();
        const statusInterval = setInterval(updateStatus, 2500);

        // Получаем запрос пользователя из адресной строки
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('query');
        
        if (query) {
            // Фронтенд запускает генерацию на сервере Render
            // и ждет, пока пройдет шоу статусов (не менее 12 секунд)
            const startTime = Date.now();

            async function checkVideoStatus() {
                try {
                    const response = await fetch(`/api/generate?query=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    if (data.status === 'ready' || data.success) {
                        const elapsedTime = Date.now() - startTime;
                        const minimumShowTime = 12000; // Показываем классное шоу минимум 12 секунд

                        if (elapsedTime >= minimumShowTime) {
                            // Если шоу открутилось и файл готов — плавно переходим к плееру!
                            clearInterval(statusInterval);
                            window.location.href = `/answer.html?video=${encodeURIComponent(data.video_url)}&query=${encodeURIComponent(query)}`;
                        } else {
                            // Если сервер Render уже всё сделал, но 12 секунд шоу ещё не прошли — ждём окончания шоу
                            setTimeout(checkVideoStatus, minimumShowTime - elapsedTime);
                        }
                    } else {
                        // Если сервер ещё монтирует, проверяем снова через 2 секунды
                        setTimeout(checkVideoStatus, 2000);
                    }
                } catch (error) {
                    console.error("Ошибка связи с сервером Render:", error);
                    setTimeout(checkVideoStatus, 3000);
                }
            }

            // Запускаем процесс
            checkVideoStatus();

        } else {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
