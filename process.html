<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хочу знать | Анализ данных</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f4;
            color: #2c3e2b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .loader-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(45, 90, 39, 0.1);
            max-width: 500px;
            width: 100%;
            border-top: 5px solid #2d5a27;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e2ebe2;
            border-top: 5px solid #4e8746;
            border-radius: 50%;
            margin: 0 auto 25px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { 
            color: #2d5a27; 
            margin-bottom: 15px; 
            font-size: 24px; 
            font-weight: 600;
            min-height: 40px; 
        }
        p { color: #667c65; font-size: 16px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="loader-card">
        <div class="spinner"></div>
        <h2 id="ai-status">ИИ «Хочу знать» запускается...</h2>
        <p>Пожалуйста, подождите. Наша автономная нейросеть монтирует персональный MP4-ролик в облаке.</p>
    </div>

    <script>
        const statusElement = document.getElementById('ai-status');
        
        const aiSteps = [
            "🤖 Устанавливаю мост с Google Gemini AI...",
            "🔍 Нейросеть собирает ключевые факты по теме...",
            "🎙️ Передаю тезисы ИИ-роботу на русскую озвучку...",
            "🎬 Утилита FFmpeg запускает облачный видеомонтаж...",
            "📦 Упаковываю готовый фильм в формат MP4..."
        ];

        let currentStep = 0;

        function updateStatus() {
            if (currentStep < aiSteps.length) {
                statusElement.innerText = aiSteps[currentStep];
                currentStep++;
            }
        }

        updateStatus();
        // ШАГ КАРТОЧЕК — 5 СЕКУНД (5000 мс)
        const statusInterval = setInterval(updateStatus, 5000);

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('query');
        
        if (query) {
            const startTime = Date.now();

            async function checkVideoStatus() {
                try {
                    const response = await fetch(`/api/generate?query=${encodeURIComponent(query)}`);
                    if (!response.ok) {
                        throw new Error("Ошибка сервера: " + response.status);
                    }
                    const data = await response.json();
                    
                    if (data.status === 'ready') {
                        const elapsedTime = Date.now() - startTime;
                        // ЖДЕМ МИНИМУМ 25 СЕКУНД (25000 мс) ДЛЯ ПОЛНОГО МОНТАЖА
                        const minimumShowTime = 25000; 

                        if (elapsedTime >= minimumShowTime) {
                            clearInterval(statusInterval);
                            window.location.href = `/answer.html?video=${encodeURIComponent(data.video_url)}&query=${encodeURIComponent(query)}`;
                        } else {
                            setTimeout(checkVideoStatus, minimumShowTime - elapsedTime);
                        }
                    } else {
                        setTimeout(checkVideoStatus, 2000);
                    }
                } catch (error) {
                    console.error("Связь с облаком Render...", error);
                    setTimeout(checkVideoStatus, 2000);
                }
            }

            checkVideoStatus();

        } else {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
