<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хочу знать | Анализ данных</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f4;
            color: #2c3e2b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .loader-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(45, 90, 39, 0.1);
            max-width: 500px;
            width: 100%;
            border-top: 5px solid #2d5a27;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e2ebe2;
            border-top: 5px solid #4e8746;
            border-radius: 50%;
            margin: 0 auto 25px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { color: #2d5a27; margin-bottom: 10px; font-size: 22px; }
        p { color: #667c65; font-size: 15px; }
    </style>
</head>
<body>

    <div class="loader-card">
        <div class="spinner"></div>
        <h2>ИИ «Хочу знать» изучает тему...</h2>
        <p>Обращаемся к Google Gemini AI для сбора ключевых тезисов. Пожалуйста, подождите, это займет всего пару секунд.</p>
    </div>

    <script>
        // Магия перенаправления: считываем поисковый запрос из адресной строки 
        // и перенаправляем его на наш Python-обработчик answer.html
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('query');
        
        if (query) {
            // Через 2 секунды красивой анимации перекидываем на answer.html
            setTimeout(() => {
                window.location.href = `/answer.html?query=${encodeURIComponent(query)}`;
            }, 2000);
        } else {
            // Если запроса почему-то нет, возвращаем на главную
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
